<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCEFDC"/>
      <stop offset="1" stop-color="#E2B47C"/>
    </linearGradient>
    <style>
      .bob { animation: bob 3s ease-in-out infinite; }
      .wave { transform-origin: 34px 100px; animation: wave 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-22deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-16deg); } }
    </style>
  </defs>
  <ellipse cx="60" cy="133" rx="24" ry="4.5" fill="#3B2F25" opacity="0.13"/>
  <g class="bob">
    <line x1="60" y1="24" x2="60" y2="10" stroke="#8C5E2A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="8" r="5" fill="#E7BE8A" stroke="#8C5E2A" stroke-width="2"/>
    <g class="wave"><rect x="16" y="90" width="22" height="13" rx="6.5" fill="#D9A867" transform="rotate(-35 34 100)"/></g>
    <rect x="82" y="94" width="13" height="24" rx="6.5" fill="#D9A867"/>
    <rect x="34" y="88" width="52" height="36" rx="17" fill="url(#shell)"/>
    <rect x="18" y="22" width="84" height="66" rx="30" fill="url(#shell)"/>
    <ellipse cx="86" cy="34" rx="7" ry="4" fill="#FFFFFF" opacity="0.7" transform="rotate(30 86 34)"/>
    <rect x="27" y="39" width="66" height="30" rx="15" fill="#3B2F25"/>
    <circle cx="47" cy="54" r="7.5" fill="#FFF6E6"/>
    <circle cx="73" cy="54" r="7.5" fill="#FFF6E6"/>
    <circle cx="47" cy="54.5" r="4" fill="#3B2F25"/>
    <circle cx="73" cy="54.5" r="4" fill="#3B2F25"/>
    <circle cx="45.5" cy="52.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="71.5" cy="52.5" r="1.6" fill="#FFFFFF"/>
    <path d="M50 76 Q60 84 70 76" fill="none" stroke="#8C5E2A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
